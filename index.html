<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (logo da taça) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#0762e4" />

    <!-- SEO básico -->
    <title>Copa do Mundo 2026 — Resultados em Tempo Real e Estatísticas</title>
    <meta
      name="description"
      content="Acompanhe a Copa do Mundo 2026 em tempo real: placares ao vivo, gols, cartões, escalações, classificação dos grupos, chaves do mata-mata, estatísticas de jogadores, estádios e as 48 seleções participantes."
    />
    <meta
      name="keywords"
      content="Copa do Mundo 2026, resultados ao vivo, placar, classificação, grupos, estatísticas, futebol, seleções, estádios"
    />
    <meta name="author" content="Copa do Mundo 2026" />
    <meta name="robots" content="index, follow" />

    <!--
      IMPORTANTE: troque "https://seu-dominio.com" abaixo pelo domínio real do
      deploy. As tags Open Graph/Twitter exigem URLs ABSOLUTAS para funcionar.
    -->
    <link rel="canonical" href="https://seu-dominio.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Telegram…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Copa do Mundo 2026" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://seu-dominio.com/" />
    <meta property="og:title" content="Copa do Mundo 2026 — Resultados em Tempo Real e Estatísticas" />
    <meta
      property="og:description"
      content="Placares ao vivo, classificação, chaves do mata-mata, estatísticas dos jogadores, estádios e as 48 seleções da Copa do Mundo 2026."
    />
    <meta property="og:image" content="https://seu-dominio.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Troféu da Copa do Mundo FIFA 2026" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Copa do Mundo 2026 — Resultados em Tempo Real" />
    <meta
      name="twitter:description"
      content="Placares ao vivo, classificação, chaves, estatísticas, estádios e as 48 seleções da Copa do Mundo 2026."
    />
    <meta name="twitter:image" content="https://seu-dominio.com/og-image.png" />
    <meta name="twitter:image:alt" content="Troféu da Copa do Mundo FIFA 2026" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
