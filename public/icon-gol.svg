<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="Bola de futebol">
  <!-- Bola -->
  <circle cx="96" cy="96" r="90" fill="#ffffff" stroke="#0b132b" stroke-width="6"/>

  <!-- Costuras (seams) do centro para a borda -->
  <g stroke="#0b132b" stroke-width="5" stroke-linecap="round">
    <line x1="96" y1="62" x2="96" y2="10"/>
    <line x1="128" y1="86" x2="178" y2="69"/>
    <line x1="116" y1="124" x2="148" y2="167"/>
    <line x1="76"  y1="124" x2="44"  y2="167"/>
    <line x1="64"  y1="86"  x2="14"  y2="69"/>
  </g>

  <!-- Pentágono central -->
  <polygon points="96,62 128,86 116,124 76,124 64,86" fill="#0b132b"/>

  <!-- Pentágonos da borda (entre as costuras) -->
  <g fill="#0b132b">
    <polygon points="138,22 153,33 148,50 130,50 124,33"/>
    <polygon points="164,103 179,114 174,131 156,131 150,114"/>
    <polygon points="96,153 111,164 106,181 86,181 80,164"/>
    <polygon points="28,103 43,114 38,131 20,131 14,114"/>
    <polygon points="54,22 69,33 64,50 46,50 40,33"/>
  </g>
</svg>
